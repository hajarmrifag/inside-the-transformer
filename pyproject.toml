[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inside-the-transformer"
version = "0.1.0"
description = "AI-assisted GPT-2 IOI activation-patching replication and position-counterbalanced robustness study"
readme = "README.md"
authors = [{name = "Hajar Mrifag"}]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.11,<3.13"
dependencies = ["transformer-lens==2.16.1", "transformers==4.57.6", "numpy==1.26.4", "pandas==2.2.3", "datasets==2.21.0", "pyarrow==17.0.0", "matplotlib>=3.8", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
